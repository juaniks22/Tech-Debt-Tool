# Estimaciones humanas de fricción anual por archivo para SGA-practicas.
# Estos datos NO salen del análisis estático - son estimaciones del equipo:
#
#   cambios_anuales: cuántas veces al año se toca este archivo (features, bugfixes, refactors)
#   delta_t_horas:   tiempo EXTRA que cuesta cada cambio por mala calidad (Tiempo Real - Eficiencia Ideal)

archivos:
  # Repositorio académico (Go) - Alta complejidad y acoplamiento a SQL
  - ruta: "backend/internal/adapter/postgres/academic_repo.go"
