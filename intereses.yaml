  # Handler HTTP de cursos (Go) - Endpoints y mapeos
  - ruta: "backend/internal/adapter/http/course_handler.go"
    cambios_anuales: 10
    delta_t_horas: 2.0

  # Pantalla de cursos (Flutter/Dart) - Widget masivo con lógica de UI y estado
  - ruta: "frontend/lib/presentation/screens/cursos_screen.dart"
    cambios_anuales: 24
    delta_t_horas: 5.0
